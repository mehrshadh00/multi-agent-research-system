services:
  aether:
    build: .
    image: aether-research-studio:latest
    ports:
      - "8501:8501"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    volumes:
      - aether_data:/app/.aether_data
    restart: unless-stopped

volumes:
  aether_data:
