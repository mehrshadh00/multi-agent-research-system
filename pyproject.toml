[build-system]
requires=["setuptools>=69","wheel"]
build-backend="setuptools.build_meta"

[project]
name="aether-research-studio"
version="0.1.0"
description="Observable multi-agent research studio with visual Streamlit interface."
readme="README.md"
requires-python=">=3.11"
dependencies=["streamlit>=1.40,<2","plotly>=5.24,<7","openai>=1.60,<3","requests>=2.32,<3","python-dotenv>=1.0,<2"]

[project.optional-dependencies]
dev=["pytest>=8,<10","ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include=["research_studio*"]

[tool.pytest.ini_options]
testpaths=["tests"]

[tool.ruff]
line-length=100
target-version="py311"
